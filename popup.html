<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>有谱么自动翻谱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #222;
      background: #fafbfc;
    }
    .header {
      padding: 12px 14px;
      background: linear-gradient(135deg, #4a7dff, #6f5bff);
      color: #fff;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header p { font-size: 11px; opacity: .85; margin-top: 2px; }
    .content { padding: 12px 14px 14px; }
    .row { margin-bottom: 12px; }
    .row .label {
      font-size: 12px; color: #555; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .row .label b { color: #4a7dff; font-weight: 600; }
    input[type="range"] {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: #dfe3ea; border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #4a7dff; cursor: pointer;
      box-shadow: 0 1px 4px rgba(74,125,255,.5);
    }
    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1; border: none; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 600; padding: 10px 0;
      transition: all .15s; font-family: inherit;
    }
    .btn-primary { background: #4a7dff; color: #fff; }
    .btn-primary:hover { background: #3a6be8; }
    .btn-primary:disabled { background: #c3c9d4; cursor: not-allowed; }
    .btn-ghost { background: #eef1f6; color: #445; }
    .btn-ghost:hover { background: #e2e6ee; }
    .btn-ghost:disabled { color: #aab; cursor: not-allowed; }
    .status {
      margin-top: 10px; font-size: 11px; color: #888; text-align: center;
      min-height: 14px;
    }
    .progress-wrap {
      height: 4px; background: #e6e9f0; border-radius: 2px; overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar { height: 100%; width: 0%; background: #4a7dff; transition: width .3s; }
    .row-inline { display: flex; align-items: center; gap: 6px; }
    .num {
      width: 58px; padding: 6px 8px; border: 1px solid #d5dae3; border-radius: 6px;
      font-size: 13px; text-align: center; font-family: inherit;
    }
    .hint { font-size: 10px; color: #9aa1ad; margin-top: 4px; line-height: 1.4; }
    .warn { color: #e0653a; }
  </style>
</head>
<body>
  <div class="header">
    <h1>有谱么 · 自动翻谱</h1>
    <p>曲谱页自动向下滚动，可调速 / 暂停</p>
  </div>
  <div class="content">
    <div class="row">
      <div class="label">
        <span>整首谱滚动时长</span>
        <b><span id="durVal">5.0</span> 分钟</b>
      </div>
      <input type="range" id="dur" min="1" max="30" step="0.5" value="5" />
      <div class="hint">设置这首歌大约弹多久滚到底，插件据此换算速度（值越小滚越快）。</div>
    </div>

    <div class="row">
      <div class="label"><span>微调速度</span><b id="speedMs">—</b></div>
      <div class="row-inline">
        <button class="btn-ghost" id="slower" style="flex:0 0 76px">− 慢一点</button>
        <button class="btn-ghost" id="faster" style="flex:0 0 76px">+ 快一点</button>
      </div>
    </div>

    <div class="row btn-group">
      <button class="btn-primary" id="toggle">开始滚动</button>
      <button class="btn-ghost" id="reset">回到顶部</button>
    </div>

    <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
    <div class="status" id="status">正在连接页面…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
